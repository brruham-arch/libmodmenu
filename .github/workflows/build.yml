name: Build ModMenu

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools & platform
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Setup NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build .so
        run: |
          $ANDROID_NDK_ROOT/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./jni/Android.mk \
            NDK_APPLICATION_MK=./jni/Application.mk

      - name: Verifikasi .so
        run: |
          ls -lh libs/armeabi-v7a/
          file libs/armeabi-v7a/libmodmenu.so
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm \
            -D libs/armeabi-v7a/libmodmenu.so | grep " T "

      - name: Compile .java → .class
        run: |
          mkdir -p build/classes
          ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-34/android.jar
          javac \
            -source 8 -target 8 \
            -cp "$ANDROID_JAR" \
            -d build/classes \
            java/ModMenuHelper.java

      - name: Compile .class → .dex
        run: |
          mkdir -p build/dex
          ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-34/android.jar
          BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/34.0.0
          $BUILD_TOOLS/d8 \
            --output build/dex \
            --lib "$ANDROID_JAR" \
            --min-api 21 \
            $(find build/classes -name "*.class")
          mv build/dex/classes.dex build/dex/modmenu.dex
          ls -lh build/dex/modmenu.dex

      - name: Upload libmodmenu.so
        uses: actions/upload-artifact@v4
        with:
          name: libmodmenu-arm32
          path: libs/armeabi-v7a/libmodmenu.so
          retention-days: 7

      - name: Upload modmenu.dex
        uses: actions/upload-artifact@v4
        with:
          name: modmenu-dex
          path: build/dex/modmenu.dex
          retention-days: 7
