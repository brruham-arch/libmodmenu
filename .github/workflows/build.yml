name: Build ModMenu

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      # ── Build libmodmenu.so ──────────────────────────────────────────────────
      - name: Build .so
        run: |
          $ANDROID_NDK_ROOT/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./jni/Android.mk \
            NDK_APPLICATION_MK=./jni/Application.mk

      - name: Verifikasi .so
        run: |
          ls -lh libs/armeabi-v7a/
          file libs/armeabi-v7a/libmodmenu.so
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm \
            -D libs/armeabi-v7a/libmodmenu.so | grep " T "

      # ── Compile ModMenuHelper.java → .dex ───────────────────────────────────
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK build-tools
        run: |
          # Install Android SDK command line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $HOME/cmdtools
          mkdir -p $HOME/android-sdk/cmdline-tools
          mv $HOME/cmdtools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install build-tools
        run: |
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT "build-tools;34.0.0" "platforms;android-34" 2>/dev/null || true
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Compile .java → .class
        run: |
          mkdir -p build/classes
          javac \
            -source 8 -target 8 \
            -cp $ANDROID_SDK_ROOT/platforms/android-34/android.jar \
            -d build/classes \
            java/ModMenuHelper.java

      - name: Compile .class → .dex
        run: |
          mkdir -p build/dex
          d8 \
            --output build/dex \
            --lib $ANDROID_SDK_ROOT/platforms/android-34/android.jar \
            --min-api 21 \
            build/classes/com/brruham/modmenu/ModMenuHelper.class \
            build/classes/com/brruham/modmenu/ModMenuHelper\$DragTouchListener.class

          mv build/dex/classes.dex build/dex/modmenu.dex
          ls -lh build/dex/modmenu.dex

      # ── Upload artifacts ─────────────────────────────────────────────────────
      - name: Upload libmodmenu.so
        uses: actions/upload-artifact@v4
        with:
          name: libmodmenu-arm32
          path: libs/armeabi-v7a/libmodmenu.so
          retention-days: 7

      - name: Upload modmenu.dex
        uses: actions/upload-artifact@v4
        with:
          name: modmenu-dex
          path: build/dex/modmenu.dex
          retention-days: 7
