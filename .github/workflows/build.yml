name: Build ModMenu

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install platform & build-tools
        run: |
          # SDK sudah pre-install di runner ubuntu-latest
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>/dev/null || true

      - name: Build .so
        run: |
          $ANDROID_NDK_ROOT/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./jni/Android.mk \
            NDK_APPLICATION_MK=./jni/Application.mk

      - name: Verifikasi .so
        run: |
          ls -lh libs/armeabi-v7a/
          file libs/armeabi-v7a/libmodmenu.so

      - name: Compile .java → .class
        run: |
          mkdir -p build/classes
          ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-34/android.jar
          javac \
            -source 8 -target 8 \
            -cp "$ANDROID_JAR" \
            -d build/classes \
            java/ModMenuHelper.java

      - name: Compile .class → .dex
        run: |
          mkdir -p build/dex
          ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-34/android.jar
          BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/34.0.0
          $BUILD_TOOLS/d8 \
            --output build/dex \
            --lib "$ANDROID_JAR" \
            --min-api 21 \
            $(find build/classes -name "*.class")
          mv build/dex/classes.dex build/dex/modmenu.dex
          ls -lh build/dex/modmenu.dex

      - name: Upload libmodmenu.so
        uses: actions/upload-artifact@v4
        with:
          name: libmodmenu-arm32
          path: libs/armeabi-v7a/libmodmenu.so
          retention-days: 7

      - name: Upload modmenu.dex
        uses: actions/upload-artifact@v4
        with:
          name: modmenu-dex
          path: build/dex/modmenu.dex
          retention-days: 7
